<!DOCTYPE html>
<html lang="en" data-page="notFound">
<head>
<meta charset="UTF-8">

<!-- Язык + анти-FOUC: до первого рендера -->
<script>
(function () {
  var lang = 'en';
  try {
    var s = localStorage.getItem('lang');
    if (s === 'en' || s === 'ru') lang = s;
    else lang = (navigator.language || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  } catch (e) {}
  document.documentElement.lang = lang;
  document.documentElement.classList.add('i18n-loading');
  setTimeout(function () {
    document.documentElement.classList.remove('i18n-loading');
  }, 2500);
})();
</script>
<style>html.i18n-loading body { visibility: hidden; }</style>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Nestter</title>
<link rel="icon" type="image/webp" href="/images/previcon.webp">

<style>
/* Пути абсолютные: эта страница открывается по любому несуществующему адресу */
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300;
  font-display: swap;
  src: url('/fonts/cormorant-garamond-v21-cyrillic_latin-300.woff2') format('woff2'),
       url('/fonts/cormorant-garamond-v21-cyrillic_latin-300.ttf') format('truetype');
}
@font-face {
  font-family: 'Space Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/space-mono-v17-latin-regular.woff2') format('woff2'),
       url('/fonts/space-mono-v17-latin-regular.ttf') format('truetype');
}
@font-face {
  font-family: 'Runes';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/runes.woff2') format('woff2'),
       url('/fonts/runes.ttf') format('truetype');
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink: #e8547a;
  --pink-light: #f07a96;
  --dark: #0a0a0a;
  --text: #d0ccc8;
  --muted: #6b6060;
}

html, body {
  min-height: 100%;
  background: var(--dark);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  overflow-x: hidden;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image: url('/images/NikoPhone.webp');
  background-size: cover;
  background-position: center right;
  filter: brightness(0.22) saturate(0.6);
}

.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
}

.page {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
}

.card {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: appear 0.9s ease both;
}

.deco-line {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--pink));
  margin-bottom: 28px;
}

.code {
  font-size: clamp(4.5rem, 22vw, 7rem);
  font-weight: 300;
  letter-spacing: 0.18em;
  line-height: 1;
  padding-left: 0.18em;
  color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
}

.runes {
  font-family: 'Runes', 'Space Mono', monospace;
  font-size: 1.3rem;
  letter-spacing: 0.3em;
  padding-left: 0.3em;
  color: var(--pink);
  margin-top: 18px;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
}

.divider {
  width: 48px;
  height: 1px;
  background: var(--muted);
  margin: 22px 0 24px;
}

.title {
  font-size: 1.7rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 1.25;
  color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
}

.note {
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  line-height: 1.75;
  color: var(--text);
  max-width: 320px;
  margin-top: 12px;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
}

.home {
  display: inline-block;
  margin-top: 32px;
  padding: 12px 26px;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--text);
  background: rgba(20, 20, 20, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  transition: border-color 0.3s, color 0.3s, transform 0.3s;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
}

.home:hover,

.home:focus-visible {
  border-color: var(--pink);
  color: var(--pink-light);
  transform: translateY(-2px);
  outline: none;
}

 /* Переключатель языка */
  .lang {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 12px;
    z-index: 10;
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 6px;
    background: rgba(10, 10, 10, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }
  .lang button {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }
  .lang button:hover { color: var(--text); }
  .lang button.active { color: var(--pink); background: rgba(232, 84, 122, 0.15); }

@keyframes appear {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0s !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
<link rel="stylesheet" href="/terminal.css">
</head>
<body>

<div class="bg"></div>
<div class="vignette"></div>


  <!--Переключатель языка -->
<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="ru">RU</button>
  
</div>

<div class="page">
  <main class="card">
    <div class="deco-line"></div>
    <div class="code" >404</div>
    <div class="runes" aria-hidden="true">lost log</div>
    <div class="divider"></div>
    <h1 class="title" data-i18n="titlen">Page not found</h1>
    <p class="note" data-i18n="note">The link may be outdated, or the page was moved</p>
    <a class="home" href="/" data-i18n="home">Go to home</a>
  </main>
</div>

<script src="/i118.js"></script>
<script src="/terminal.js"></script>

<script>

  // --- Терминал: движок в /terminal.js, здесь только команды этой страницы ---
  if (window.Terminal) {
    Terminal.init({
      title: 'NESTTER_OS / RECOVERY MODE',
      greeting: ['System lost in the void.', "Type '/help' to see available recovery commands."],
      triggers: ['log', 'дщп'],
      commands: {
        "/home": (t) => {
          t.line('Escaping the void... Returning to reality.', 'ok');
          setTimeout(() => { window.location.href = '/'; }, 1000);
        },
        "/help": (t) => {
          t.help('Available recovery commands:', [
            ['/home', 'Return to main page'],
            ['/clear', 'Clear terminal'],
            ['/exit', 'Close terminal']
          ]);
        },
        "/clear": (t) => t.clear(),
        "/exit": (t) => t.close()
      }
    });
  }
</script>

</body>
</html>
