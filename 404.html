<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Nestter</title>
<link rel="icon" type="image/webp" href="/images/previcon.webp">

<style>
/* Пути абсолютные: эта страница открывается по любому несуществующему адресу */
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300;
  font-display: swap;
  src: url('/fonts/cormorant-garamond-v21-cyrillic_latin-300.woff2') format('woff2'),
       url('/fonts/cormorant-garamond-v21-cyrillic_latin-300.ttf') format('truetype');
}
@font-face {
  font-family: 'Space Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/space-mono-v17-latin-regular.woff2') format('woff2'),
       url('/fonts/space-mono-v17-latin-regular.ttf') format('truetype');
}
@font-face {
  font-family: 'Runes';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/runes.woff2') format('woff2'),
       url('/fonts/runes.ttf') format('truetype');
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink: #e8547a;
  --pink-light: #f07a96;
  --dark: #0a0a0a;
  --text: #d0ccc8;
  --muted: #6b6060;
}

html, body {
  min-height: 100%;
  background: var(--dark);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  overflow-x: hidden;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image: url('/images/NikoPhone.webp');
  background-size: cover;
  background-position: center right;
  filter: brightness(0.22) saturate(0.6);
}

.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
}

.page {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
}

.card {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: appear 0.9s ease both;
}

.deco-line {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--pink));
  margin-bottom: 28px;
}

/* Три цифры: единственный крупный элемент страницы */
.code {
  font-size: clamp(4.5rem, 22vw, 7rem);
  font-weight: 300;
  letter-spacing: 0.18em;
  line-height: 1;
  padding-left: 0.18em;
  color: var(--text);
}

.runes {
  font-family: 'Runes', 'Space Mono', monospace;
  font-size: 1.3rem;
  letter-spacing: 0.3em;
  padding-left: 0.3em;
  color: var(--pink);
  margin-top: 18px;
}

.divider {
  width: 48px;
  height: 1px;
  background: var(--muted);
  margin: 22px 0 24px;
}

.title {
  font-size: 1.7rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 1.25;
  color: var(--text);
}

.note {
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  line-height: 1.75;
  color: var(--text);
  max-width: 320px;
  margin-top: 12px;
}

.home {
  display: inline-block;
  margin-top: 32px;
  padding: 12px 26px;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--text);
  background: rgba(20, 20, 20, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  transition: border-color 0.3s, color 0.3s, transform 0.3s;
}

.home:hover,
.home:focus-visible {
  border-color: var(--pink);
  color: var(--pink-light);
  transform: translateY(-2px);
  outline: none;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0s !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="vignette"></div>

<div class="page">
  <main class="card">
    <div class="deco-line"></div>
    <div class="code">404</div>
    <div class="runes" aria-hidden="true">lost</div>
    <div class="divider"></div>
    <h1 class="title" data-i18n="title">Page not found</h1>
    <p class="note" data-i18n="note">The link may be outdated, or the page was moved.</p>
    <a class="home" href="/" data-i18n="home">Back to home</a>
  </main>
</div>

<script>
(function () {
  var dict = {
    en: {
      doc: '404 — Nestter',
      title: 'Page not found',
      note: 'The link may be outdated, or the page was moved.',
      home: 'Back to home'
    },
    ru: {
      doc: '404 — Nestter',
      title: 'Страница не найдена',
      note: 'Ссылка могла устареть, или страницу перенесли.',
      home: 'На главную'
    }
  };

  // Тот же выбор языка, что и на главной: сохранённый, иначе по языку браузера
  var lang = 'en';
  try {
    var saved = localStorage.getItem('lang');
    if (saved === 'en' || saved === 'ru') lang = saved;
    else if ((navigator.language || '').toLowerCase().indexOf('ru') === 0) lang = 'ru';
  } catch (e) {
    if ((navigator.language || '').toLowerCase().indexOf('ru') === 0) lang = 'ru';
  }

  var d = dict[lang];
  document.documentElement.lang = lang;
  document.title = d.doc;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (d[key] !== undefined) el.textContent = d[key];
  });
})();
</script>

</body>
</html>
